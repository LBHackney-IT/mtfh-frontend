# Trusted publisher workflow (OIDC). Only this filename may be registered on npmjs.com
# for each @hackney/* package that this monorepo publishes.
#
# Triggered once after Release Please (via workflow_dispatch from release-please.yml),
# not on each GitHub Release — independent packages would otherwise spawn N publish runs.
name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Tag or ref to publish (e.g. @hackney/mtfh-react-v1.3.0, main)
        required: true
        default: main
        type: string

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install modules
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Publish packages
        run: npx lerna publish from-package --yes

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy Storybook
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: storybook-static

      - name: Summary
        run: |
          {
            echo "### Packages published (trusted publisher / OIDC)"
            echo ""
            echo "- **Dist-tag:** \`latest\`"
            echo "- **Ref:** \`${{ inputs.git_ref }}\`"
            echo ""
            echo "Published via \`lerna publish from-package\` for versions not already on npm."
          } >> "$GITHUB_STEP_SUMMARY"
